name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - 4.1
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload Gradle Build Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            **/hs_err_pid*.log

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-output/Winlator-OctaFX-v1.0.6.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-OctaFX-v1.0.6
          path: release-output/Winlator-OctaFX-v1.0.6.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/4.1'
        with:
          tag_name: v1.0.6-OctaFX
          name: "Winlator-OctaFX v1.0.6 (Snapdragon 8s Gen 3 Adreno 735 Dynamic GPU Sensor, Turnip GCM & Shader Cache Boost)"
          body: |
            Winlator-OctaFX v1.0.6:
            - **Dynamic Adreno 735 / Snapdragon 8s Gen 3 GPU Sensor**: Overcomes Qualcomm GMU firmware autonomous power management where host sysfs `gpubusy` returns 0 ticks to unprivileged userland apps on Android 14 / HyperOS. Added recursive platform SoC devfreq traversal and responsive frequency-scaled utilization estimation ($\frac{cur - min}{max - min} \times 100\%$).
            - **Turnip Persistent 6GB Shader Cache**: Explicitly anchors `MESA_SHADER_CACHE_DIR=/home/xuser/.cache` to persistent container storage across launches and expands `MESA_SHADER_CACHE_MAX_SIZE` to **6144MB** to eliminate shader compilation stutter and cache eviction drops.
            - **Freedreno IR3 Global Code Motion**: Enables `IR3_SHADER_DEBUG=gcm` to run Global Code Motion optimization in the Turnip compiler backend, hoisting loop invariants and reducing register pressure across Adreno 735 ALUs.
            - **DXVK Performance Core Pinning**: Dynamically sets `dxvk.numCompilerThreads` based on SoC architecture (5 worker threads on Snapdragon 8s Gen 3 / POCO F6) to prevent shader compilation stalls on slow Cortex-A520 efficiency cores.
            - **ARMv9 Dynarec Turbo Supercharged**: Upgraded Box64 preset with `BOX64_DYNAREC_WEAKBARRIER=1`, `BOX64_DYNAREC_DIRTY=1`, and expanded dynarec forward lookahead buffer `FORWARD=1024`.
            - **Full Cumulative Core**: Retains ADPF Sustained Performance, Qualcomm Hexagon NPU AI Frame Generation, Aggressive RAM Defense (`oom_score_adj -1000`), SoC Affinity Masking, and DXVK Zstd Pre-Caching.
          files: release-output/Winlator-OctaFX-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
