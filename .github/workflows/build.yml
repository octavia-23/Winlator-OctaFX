name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - 4.1
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload Gradle Build Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            **/hs_err_pid*.log

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-output/Winlator-OctaFX-v1.0.8.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-OctaFX-v1.0.8
          path: release-output/Winlator-OctaFX-v1.0.8.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/4.1'
        with:
          tag_name: v1.0.8-OctaFX
          name: "Winlator-OctaFX v1.0.8 (Sidebar Upscaling Restoration & Clean Frame Gen Toggle)"
          body: |
            Winlator-OctaFX v1.0.8:
            - **Restored Performance & Upscaling UI in Sidebar**: Fixed an architectural flaw where activating Frame Gen / DisplayX caused the sidebar to hide the entire Performance & Image Quality card (`LLStandardOptions`), FSR switch, upscaler mode selector, sharpness slider, and post-processing FX controls. All controls remain persistently visible and configurable across both DisplayX and Vulkan pipelines.
            - **Bidirectional Frame Gen Lifecycle & Clean Toggle Off**: Fixed a critical state-machine bug where selecting Frame Gen "Off" failed to clear `useDisplayX`, leaving the container permanently locked in DisplayX mode. Selecting "Off" now cleanly resets `useDisplayX = 0`, calls `nativeSetFrameGenMode(0)` immediately, and cleanly restores the native Vulkan presentation pipeline on subsequent boots.
            - **DisplayX Early-Return Architecture Fix**: Eliminated the premature `vkRenderer == null` return that blocked the Frame Gen dropdown from binding listeners and updating state while running in DisplayX mode.
            - **Preset Persistence**: Saved presets now record Frame Gen state and upscaling configurations across both containers and shortcuts simultaneously.
            - **Cumulative Core**: Retains Adreno 735 Dynamic GPU Sensor, Turnip 6GB Shader Cache, IR3 GCM, DXVK 5-core pinning, ARMv9 Turbo, and ADPF Thermal Sustained Performance.
          files: release-output/Winlator-OctaFX-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
