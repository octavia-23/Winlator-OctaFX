name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - 4.1
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload Gradle Build Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            app/build/reports/
            **/hs_err_pid*.log

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-output/Winlator-OctaFX-v1.0.4.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-OctaFX-v1.0.4
          path: release-output/Winlator-OctaFX-v1.0.4.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/4.1'
        with:
          tag_name: v1.0.4-OctaFX
          name: "Winlator-OctaFX v1.0.4 (Auto SoC Topology Pinning & DXVK Zstd Pre-Cache)"
          body: |
            Winlator-OctaFX v1.0.4:
            - **Intelligent SoC Detection & Topology Pinning**: Automatically detects host chipset (Qualcomm Snapdragon 8s Gen 3, 8 Gen 3, 8 Gen 2, 8 Gen 1/888, 870/865, Dimensity 9300/9400, etc.) and auto-configures optimal CPU affinity masks.
            - **POCO F6 (Snapdragon 8s Gen 3 / SM8635) Optimization**: Prioritizes Prime Cortex-X4 (Core 7) + Performance Cortex-A720 (Cores 3-6) while completely masking out weak Cortex-A520 efficiency cores (Cores 0-2).
            - **DXVK / VKD3D Pipeline Pre-Cache (Zstandard)**: Instant zero-stutter shader and pipeline state loading with real-time level-3 Zstd compression. Drastically shrinks cache disk usage while preserving compiled Vulkan pipelines across game sessions.
            - **State Cache Management UI**: Added real-time cache size reporting and one-click "Purge Cache" inside DXVK Configuration Dialog.
            - **Aggressive RAM Defense & OOM Immunity**: Preserves all v1.0.3 LMKD protection, `oom_score_adj -1000`, `mallopt(M_PURGE)` memory compaction, and Qualcomm Hexagon NPU Frame Generation.
          files: release-output/Winlator-OctaFX-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
